<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>زكي AI</title>
<style>
:root{--bg:#0f1220;--card:#181c30;--fg:#eef0ff;--ac:#6c7bff;--mut:#8a90b8}
@media (prefers-color-scheme:light){:root{--bg:#f4f5ff;--card:#fff;--fg:#171a2e;--mut:#666c94}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--fg)}
header{padding:14px 20px;font-weight:700;font-size:20px}nav{display:flex;gap:8px;padding:0 16px 10px;flex-wrap:wrap}
button,input,select{font:inherit;border-radius:10px;border:1px solid #0003;padding:10px 14px;background:var(--card);color:var(--fg)}
button{cursor:pointer;background:var(--ac);color:#fff;border:0}button.alt{background:var(--card);color:var(--fg);border:1px solid #6c7bff55}
button.on{outline:2px solid #fff8}button:disabled{opacity:.6;cursor:wait}small,.muted{color:var(--mut)}#statusbar{padding:4px 18px 12px;font-size:12px;color:var(--mut)}
section{display:none;padding:0 16px 16px;max-width:900px;margin:auto}section.show{display:block}
#chat{height:56vh;overflow:auto;background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px}
.m{margin:8px 0;padding:10px 12px;border-radius:12px;white-space:pre-wrap;line-height:1.7}
.u{background:var(--ac);color:#fff;margin-right:20%}.a{background:#6c7bff22;margin-left:20%}
.row{display:flex;gap:8px;flex-wrap:wrap}.row input{flex:1;min-width:160px}
img,video,canvas{max-width:100%;border-radius:12px;margin-top:10px}
@media(max-width:600px){header{font-size:18px}nav{display:grid;grid-template-columns:repeat(2,1fr)}nav button{width:100%}section{padding:0 10px 14px}#chat{height:52vh}.u{margin-right:5%}.a{margin-left:5%}.row{gap:6px}.row input{min-width:100%}}
</style>
</head>
<body>
<header>🤖 زكي AI <span style="font-size:12px;color:var(--mut)">v3 · Multi-Engine</span></header>
<div id="statusbar"><div id="apiStatus">جاري فحص الخادم…</div><div id="memoryStatus">تحميل الذاكرة المحلية…</div></div>
<nav>
 <button class="alt" data-t="chat">💬 شات</button>
 <button class="alt" data-t="img">🖼️ صور</button>
 <button class="alt" data-t="vid">🎬 فيديو</button>
 <button class="alt" data-t="dev">📂 الجهاز</button>
</nav>
<section id="chat-s" class="show">
 <div class="row" style="margin-bottom:8px">
  <label for="provider">المحرك:</label>
  <select id="provider">
   <option value="auto">Zaki Auto Pilot (اختيار تلقائي + بدائل)</option>
   <option value="Gemini">Gemini</option><option value="Groq">Groq</option>
   <option value="OpenRouter">OpenRouter</option><option value="Cloudflare AI">Cloudflare AI</option>
   <option value="NVIDIA NIM">NVIDIA NIM</option><option value="Mistral">Mistral</option>
  </select>
 </div>
 <div id="chat"></div>
 <div class="row">
  <input id="msg" placeholder="اكتب رسالتك…">
  <button id="send">إرسال</button>
  <button id="live" class="alt">🎙️ محادثة صوتية</button>
  <button id="exportChat" class="alt">تصدير المحادثة</button><button id="clearChat" class="alt">مسح المحادثة</button>
 </div>
</section>
<section id="img-s">
 <div class="row"><input id="ip" placeholder="وصف الصورة…"><button id="ig">توليد</button></div>
 <img id="iout" alt="">
 <h3>تحليل صورة بالذكاء الاصطناعي (Moondream)</h3>
 <div class="row"><input type="file" id="visionFile" accept="image/*">
  <input id="visionQuestion" placeholder="ماذا تريد أن أعرف عن الصورة؟">
  <button id="analyzeImage">تحليل الصورة</button></div>
 <p id="visionStatus" style="color:var(--mut)"></p>
 <div id="visionAnswer" style="white-space:pre-wrap"></div>
 <h3>تعديل صورة</h3>
 <div class="row">
  <input type="file" id="ifile" accept="image/*">
  <select id="flt"><option value="none">بدون</option><option value="grayscale(1)">أبيض وأسود</option>
   <option value="sepia(1)">سيبيا</option><option value="brightness(1.3)">إضاءة</option>
   <option value="contrast(1.4)">تباين</option><option value="blur(3px)">بلور</option></select>
  <button id="idl">تحميل</button>
 </div>
 <canvas id="cv"></canvas>
</section>
<section id="vid-s">
 <div class="row"><input id="vp" placeholder="وصف الفيديو (بالإنجليزي أفضل)…"><button id="vg">توليد</button></div>
 <p id="vs" style="color:var(--mut)"></p><video id="vout" controls></video>
</section>
<section id="dev-s">
 <div class="row">
  <button id="cam">📷 الكاميرا</button><button id="loc">📍 الموقع</button>
  <button id="fs">📁 فتح ملف نصي</button>
 </div>
 <video id="cvid" autoplay playsinline style="display:none"></video>
 <pre id="dout" style="white-space:pre-wrap"></pre>
</section>
<script type="module" src="app.js"></script>
</body>
</html>
